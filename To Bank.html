<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Transfer To Bank - PalmPay</title>
<style>
  :root {
    --bg: #0f0f12;
    --panel: #17171c;
    --muted: #9aa2b2;
    --purple: #7c3aed;
    --purple-2: #5b21b6;
    --card: #17171c;
    --accent: #ffd166;
    --receipt-bg: #17171c;
    --select-bg: #0b0b0c;
    --select-border: rgba(255,255,255,0.1);
    --tx-bg: #1a1a1f;
    --dropdown-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  [data-theme="light"] {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --muted: #6b7280;
    --purple: #7c3aed;
    --purple-2: #5b21b6;
    --card: #ffffff;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { 
    height: 100dvh; 
    margin: 0; 
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; 
    background: var(--bg); 
    color: var(--text-color, #fff); 
    -webkit-font-smoothing: antialiased; 
    overflow-x: hidden;
    line-height: 1.5;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  [data-theme="light"] {
    --text-color: #111;
  }
  .app { 
    max-width: 420px; 
    margin: 0 auto; 
    min-height: 100dvh; 
    display: flex; 
    flex-direction: column; 
    padding-bottom: 20px; 
  }
  header { 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    padding: 12px; 
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--header-border, rgba(255,255,255,0.03));
    transition: background 0.3s ease, border 0.3s ease;
  }
  [data-theme="light"] {
    --header-border: rgba(0,0,0,0.1);
  }
  .back-btn {
    background: var(--icon-bg, #0f1113);
    border: 1px solid var(--icon-border, rgba(255,255,255,0.03));
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.3s ease, border 0.3s ease;
  }
  [data-theme="light"] {
    --icon-bg: #f0f0f0;
    --icon-border: rgba(0,0,0,0.1);
  }
  .header-title {
    flex: 1;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-color, #fff);
    transition: color 0.3s ease;
  }
  .icons { display: flex; gap: 6px; align-items: center; }
  .icon-btn { 
    width: 32px; 
    height: 32px; 
    border-radius: 8px; 
    background: var(--icon-bg, #0f1113); 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    border: 1px solid var(--icon-border, rgba(255,255,255,0.03)); 
    cursor: pointer;
    transition: background 0.3s ease, border 0.3s ease;
  }
  .form-card { 
    margin: 16px 12px; 
    padding: 20px; 
    border-radius: 12px; 
    background: var(--form-bg, #0f1113); 
    border: 1px solid var(--form-border, rgba(255,255,255,0.02)); 
    transition: background 0.3s ease, border 0.3s ease;
    overflow: visible;
  }
  [data-theme="light"] {
    --form-bg: rgba(255, 255, 255, 0.95);
    --form-border: rgba(0,0,0,0.1);
    --input-bg: #ffffff;
    --input-border: rgba(0,0,0,0.1);
    --select-bg: #ffffff;
    --select-border: rgba(0,0,0,0.15);
    --receipt-bg: #ffffff;
    --tx-bg: #f5f5f7;
    --dropdown-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  input[type="text"], input[type="number"] { 
    width: 100%; 
    padding: 12px; 
    border-radius: 8px; 
    border: 1px solid var(--input-border, rgba(255,255,255,0.05)); 
    margin: 8px 0; 
    background: var(--input-bg, #0b0b0c); 
    color: var(--text-color, #fff); 
    font-size: 14px; 
    transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--purple);
  }
  .primary { 
    background: var(--purple); 
    border: none; 
    color: #fff; 
    padding: 12px; 
    border-radius: 8px; 
    width: 100%; 
    font-weight: 700; 
    cursor: pointer; 
    font-size: 14px; 
    transition: opacity 0.3s ease;
  }
  .primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .primary.loading {
    opacity: 0.7;
    cursor: wait;
  }
  .small-btn {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--form-border, rgba(255,255,255,0.02));
    background: var(--input-bg, #0b0b0c);
    color: var(--text-color, #fff);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease, border 0.3s ease, color 0.3s ease;
  }
  .small-btn.ghost {
    background: transparent;
    border: 1px solid var(--form-border, rgba(255,255,255,0.1));
  }
  .status { margin-top: 8px; font-size: 13px; min-height: 18px; }
  .success-screen { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    display: none; 
    flex-direction: column; 
    background: var(--bg); 
    z-index: 100; 
    overflow-y: auto; 
    padding: 0; 
    transition: background 0.3s ease;
  }
  .success-screen.active { display: flex; }
  .receipt-top-bar { 
    display: flex; 
    align-items: center; 
    padding: 16px; 
    background: var(--bg); 
    position: sticky; 
    top: 0; 
    z-index: 1; 
    gap: 10px; 
  }
  .receipt-back-btn { 
    background: transparent; 
    border: none; 
    color: var(--text-color, #fff); 
    font-size: 18px; 
    cursor: pointer; 
    transition: color 0.3s ease;
  }
  .receipt-title { 
    font-size: 16px; 
    font-weight: 600; 
    color: var(--text-color, #fff);
    transition: color 0.3s ease;
  }
  .receipt-container {
    background: var(--receipt-bg, #17171c);
    padding: 24px;
    border-radius: 20px;
    margin: 16px;
    transition: background 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .receipt-container::before {
    content: "PalmPay  PalmPay  PalmPay  PalmPay";
    position: absolute;
    inset: 0;
    color: rgba(255,255,255,0.03);
    font-size: 40px;
    transform: rotate(-20deg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
    z-index: 0;
  }
  .receipt-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
  }
  .receipt-amount {
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    color: #7c6cff;
    margin-bottom: 6px;
    position: relative;
    z-index: 2;
  }
  .receipt-status {
    text-align: center;
    font-weight: 600;
    margin-bottom: 4px;
    position: relative;
    z-index: 2;
  }
  .receipt-date {
    text-align: center;
    font-size: 13px;
    color: #b3b3b3;
    margin-bottom: 20px;
    position: relative;
    z-index: 2;
  }
  .divider {
    border-top: 1px dashed #2a2a2f;
    margin: 18px 0;
    position: relative;
    z-index: 2;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    position: relative;
    z-index: 2;
  }
  .label {
    color: #cfcfcf;
    font-size: 14px;
  }
  .value {
    text-align: right;
    font-size: 14px;
  }
  .value strong {
    display: block;
    font-weight: 600;
    color: var(--text-color, #fff);
    transition: color 0.3s ease;
  }
  .sub {
    font-size: 13px;
    color: #a6a6a6;
    margin-top: 2px;
  }
  [data-theme="light"] .label {
    color: #666;
  }
  [data-theme="light"] .sub {
    color: #888;
  }
  .section-title {
    font-weight: 600;
    margin-bottom: 10px;
    position: relative;
    z-index: 2;
  }
  .receipt-footer-note {
    text-align: center;
    font-size: 12px;
    color: #9b9b9b;
    margin-top: 20px;
    line-height: 1.5;
    position: relative;
    z-index: 2;
  }
  .receipt-sub-value { 
    font-size: 12px; 
    color: var(--muted); 
    margin-top: 2px; 
    text-align: right;
  }
  .receipt-info-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--form-border, rgba(255,255,255,0.05));
    transition: border-color 0.3s ease;
    z-index: 1;
    position: relative;
  }
  .receipt-info-label {
    font-size: 12px;
    color: var(--muted);
  }
  .receipt-info-value {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-color, #fff);
    transition: color 0.3s ease;
    font-family: 'Courier New', monospace;
  }
  .receipt-footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--purple);
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--form-border, rgba(255,255,255,0.05));
    transition: border-color 0.3s ease, color 0.3s ease;
    z-index: 1;
    position: relative;
    letter-spacing: 0.5px;
  }
  .receipt-actions {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid var(--form-border, rgba(255,255,255,0.05));
    background: var(--bg);
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .receipt-action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--form-border, rgba(255,255,255,0.1));
    background: var(--input-bg, #0b0b0c);
    color: var(--text-color, #fff);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.3s ease, border 0.3s ease, color 0.3s ease;
  }
  /* Saved Accounts Section */
  .saved-accounts-wrapper {
    padding: 0 12px 12px 12px;
    display: none;
  }
  .saved-accounts-wrapper.active {
    display: block;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--form-border, rgba(255,255,255,0.05));
    padding-bottom: 8px;
  }
  .tab {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 6px;
    transition: color 0.3s ease, background 0.3s ease;
  }
  .tab.active {
    color: var(--text-color, #fff);
    background: rgba(124, 58, 237, 0.2);
  }
  .accounts-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 400px;
    overflow-y: auto;
  }
  .account-item {
    position: relative;
    display: flex;
    gap: 12px;
    padding: 12px;
    background: var(--form-bg, #0f1113);
    border: 1px solid var(--form-border, rgba(255,255,255,0.02));
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.3s ease, border 0.3s ease, transform 0.2s ease;
  }
  .account-item:hover {
    background: rgba(124, 58, 237, 0.15);
    border-color: var(--purple);
    transform: translateX(4px);
  }
  .account-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .account-delete:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text-color, #fff);
  }
  .account-avatar {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
  }
  .account-details {
    flex: 1;
  }
  .account-name {
    font-weight: 700;
    font-size: 13px;
    color: var(--text-color, #fff);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .account-number {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .account-bank {
    font-size: 10px;
    color: var(--muted);
  }
  .account-last-transfer {
    font-size: 9px;
    color: var(--muted);
    margin-top: 4px;
  }
  .no-accounts {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
<!-- PWA Configuration -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="A fast, secure banking dashboard with Paystack integration">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%237c3aed' width='192' height='192'/><text x='50%' y='50%' font-size='80' font-weight='bold' fill='white' text-anchor='middle' dy='.3em' font-family='sans-serif'>P</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%237c3aed' width='180' height='180' rx='40'/><text x='50%' y='50%' font-size='80' font-weight='bold' fill='white' text-anchor='middle' dy='.3em' font-family='sans-serif'>P</text></svg>">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PalmPay">
</head>
<body>
<div class="app">
  <header>
    <button class="back-btn" id="backBtn" onclick="window.location.href='index.html'">←</button>
    <div class="header-title">Transfer To Bank</div>
    <div class="icons">
      <div class="icon-btn" id="themeToggle" title="Toggle theme">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" style="transition: transform 0.3s ease;">
          <!-- Sun icon (shown in dark mode) -->
          <path id="sunIcon" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" style="display: block;"/>
          <!-- Moon icon (shown in light mode) -->
          <path id="moonIcon" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" style="display: none;"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- Transfer Form -->
  <div class="form-card">
    <div style="position:relative;margin-bottom:8px;">
      <input type="text" id="bankSearch" placeholder="Search Bank or Type Bank Name Manually (e.g., OPay, Kuda, Access, UBA, WEMA)" autocomplete="off" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--select-border, rgba(255,255,255,0.02));background:var(--select-bg, #0b0b0c);color:var(--text-color, #fff);font-size:14px;transition:background 0.3s ease, border 0.3s ease, color 0.3s ease;">
      <div id="bankDropdown" style="display:none;position:absolute;top:100%;left:0;right:0;max-height:300px;overflow-y:auto;background:var(--select-bg, #0b0b0c);border:1px solid var(--select-border, rgba(255,255,255,0.1));border-radius:6px;margin-top:4px;z-index:10000;box-shadow:var(--dropdown-shadow, 0 8px 24px rgba(0,0,0,0.5));transition:background 0.3s ease, border 0.3s ease, box-shadow 0.3s ease;"></div>
      <div id="bankManualStatus" style="font-size:11px;margin-top:4px;color:var(--muted);min-height:14px;transition:color 0.3s ease;"></div>
    </div>
    <input type="hidden" id="bankSelect" value="">
    <input type="text" id="bankAcct" placeholder="Bank Account Number (10 digits)" required maxlength="10" pattern="[0-9]{10}">
    <input type="text" id="accountName" placeholder="Account Name (auto-filled or enter manually)" required>
    <div id="accountVerificationStatus" style="font-size:12px;margin:4px 0;min-height:16px;"></div>
    <button type="button" id="enterManuallyBtn" class="small-btn ghost" style="width:100%;margin-top:4px;display:none;">Enter Name Manually</button>
    <input type="number" id="sendAmount" placeholder="₦ Amount" required>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="primary" id="submitTransfer" style="flex:1" disabled>Transfer</button>
      <button type="button" class="small-btn ghost" id="cancelTransfer" style="flex:1">Cancel</button>
    </div>
    <div id="formStatus" class="status"></div>
  </div>

  <!-- Saved Accounts Section -->
  <div class="saved-accounts-wrapper" id="savedAccountsWrapper">
    <div class="tabs">
      <button class="tab active" data-tab="recent">Recent</button>
      <button class="tab" data-tab="favorites">Favorites</button>
      <button class="tab" data-tab="all">All Accounts</button>
    </div>
    <div class="accounts-list" id="accountsList">
      <div class="no-accounts">No saved accounts yet</div>
    </div>
  </div>

  <!-- Success Screen with Receipt -->
  <div class="success-screen" id="successScreen">
    <div class="receipt-top-bar">
      <button class="receipt-back-btn" id="closeSuccess">&lt;</button>
      <div class="receipt-title">Transaction Receipt</div>
    </div>
    <div id="receiptDetails" class="receipt-container"></div>
    <div class="receipt-actions">
      <button class="receipt-action-btn" id="shareReceipt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8m-4-6l-4-4-4 4m4-4v10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Share as Image</button>
      <button class="receipt-action-btn" id="saveReceipt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v12H8V8H4V4zm4 4v8h12V4H8v4z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Save as PDF</button>
    </div>
  </div>
</div>

<script>
/* -------------------------
   Demo banking logic (localStorage)
   ------------------------- */
const LS_BAL = 'demo_balance_ngn';
const LS_TX = 'demo_transactions_ngn';
const LS_THEME = 'demo_theme';
const LS_PIN = 'demo_pin';
const LS_SAVED_ACCOUNTS = 'demo_saved_accounts';

/* default data */
let balance = parseFloat(localStorage.getItem(LS_BAL) || '556489.00');
let transactions = JSON.parse(localStorage.getItem(LS_TX) || JSON.stringify([]));
let savedAccounts = JSON.parse(localStorage.getItem(LS_SAVED_ACCOUNTS) || JSON.stringify([]));
let currentTab = 'recent';

/* UI refs */
const bankSelect = document.getElementById('bankSelect');
const bankSearch = document.getElementById('bankSearch');
const bankDropdown = document.getElementById('bankDropdown');
const bankAcct = document.getElementById('bankAcct');
const accountName = document.getElementById('accountName');
const accountVerificationStatus = document.getElementById('accountVerificationStatus');
const sendAmount = document.getElementById('sendAmount');
const formStatus = document.getElementById('formStatus');
const submitTransfer = document.getElementById('submitTransfer');
const cancelTransfer = document.getElementById('cancelTransfer');
const enterManuallyBtn = document.getElementById('enterManuallyBtn');
const successScreen = document.getElementById('successScreen');
const receiptDetails = document.getElementById('receiptDetails');
const closeSuccess = document.getElementById('closeSuccess');

// Saved accounts UI refs
const savedAccountsWrapper = document.getElementById('savedAccountsWrapper');
const accountsList = document.getElementById('accountsList');
const accountsTabs = document.querySelectorAll('.tab');

// Monnify integration state
let banksList = [];
let filteredBanksList = [];
let selectedBankCode = null;
let selectedBankName = '';
let isAccountVerified = false;
let isManualBankEntry = false;

// API base URL
// Use same-origin when served by backend; fall back to local backend when opened as file://
const API_BASE_URL = window.location.protocol === 'file:'
  ? 'http://localhost:3001'
  : '';

const LS_USER = 'demo_user';
const senderAccountMask = '904***9211';

function getUserName() {
  try {
    const u = JSON.parse(localStorage.getItem(LS_USER) || 'null');
    return (u && (u.name || u.phone)) || 'PalmPay User';
  } catch {
    return 'PalmPay User';
  }
}

function getUserPhone() {
  try {
    const u = JSON.parse(localStorage.getItem(LS_USER) || 'null');
    return (u && u.phone) || 'No phone number';
  } catch {
    return 'No phone number';
  }
}

/* helpers */
function genId() { return Math.random().toString(36).slice(2, 14); }
function genSessId() { return Math.floor(Math.random() * 1e15) + ' ' + Math.floor(Math.random() * 1e14); }
function saveState() { 
  localStorage.setItem(LS_BAL, balance); 
  localStorage.setItem(LS_TX, JSON.stringify(transactions));
  localStorage.setItem(LS_SAVED_ACCOUNTS, JSON.stringify(savedAccounts));
}

function requirePin(nextPage = 'To Bank.html') {
  // PIN functionality removed - allowing transfer to proceed
  return true;
}

function executePendingTransfer() {
  const pending = sessionStorage.getItem('pendingTransfer');
  if (!pending) return false;
  try {
    const data = JSON.parse(pending);
    if (!data.bAcct) return false;
    // Populate form fields so UI stays consistent
    bankAcct.value = data.bAcct;
    accountName.value = data.aName;
    bankSearch.value = data.bName;
    sendAmount.value = data.amount;
    // Clear pending so it doesn't run again
    sessionStorage.removeItem('pendingTransfer');
    // continue with transfer - bypass additional pin requirement
    performTransfer(data);
    return true;
  } catch {
    return false;
  }
}
function formatNGN(n) { return '₦ ' + Number(n).toLocaleString('en-NG', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function getFormattedDate(ts) {
  const date = new Date(ts);
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
}

/* Saved Accounts Functions */
function saveAccount(bank, acctNum, acctName) {
  // Check if account already exists
  const existing = savedAccounts.find(a => a.accountNumber === acctNum);
  if (existing) {
    existing.lastTransfer = new Date().getTime();
  } else {
    savedAccounts.unshift({
      id: genId(),
      accountName: acctName,
      accountNumber: acctNum,
      bankName: bank,
      timestamp: new Date().getTime(),
      lastTransfer: new Date().getTime(),
      isFavorite: false
    });
  }
  saveState();
  renderSavedAccounts();
}

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().substring(0, 2);
}

function renderSavedAccounts(filter = '') {
  if (savedAccounts.length === 0) {
    accountsList.innerHTML = '<div class="no-accounts">No saved accounts yet. Complete a transfer to save.</div>';
    savedAccountsWrapper.classList.remove('active');
    return;
  }

  savedAccountsWrapper.classList.add('active');

  let filtered = savedAccounts;
  
  // Filter by prefix (first 3 digits)
  if (filter.length > 0) {
    filtered = filtered.filter(acc => acc.accountNumber.startsWith(filter));
  }
  
  // Filter by tab
  if (currentTab === 'recent') {
    filtered = filtered.sort((a, b) => (b.lastTransfer || 0) - (a.lastTransfer || 0));
  } else if (currentTab === 'favorites') {
    filtered = filtered.filter(a => a.isFavorite).sort((a, b) => (b.lastTransfer || 0) - (a.lastTransfer || 0));
  }

  if (filtered.length === 0) {
    accountsList.innerHTML = '<div class="no-accounts">No accounts found</div>';
    return;
  }

  let html = '';
  filtered.forEach(acc => {
    const lastTransferDate = acc.lastTransfer ? new Date(acc.lastTransfer).toLocaleDateString('en-NG', {month: 'short', day: 'numeric', year: 'numeric'}) : '';
    const initials = getInitials(acc.accountName);
    html += `
      <div class="account-item" onclick="fillAccountForm('${acc.accountNumber}', '${acc.accountName}', '${acc.bankName}')">
        <button class="account-delete" title="Remove saved account" onclick="deleteSavedAccount(event, '${acc.id}')">×</button>
        <div class="account-avatar">${initials}</div>
        <div class="account-details">
          <div class="account-name">${acc.accountName}</div>
          <div class="account-number">${acc.accountNumber}</div>
          <div class="account-bank">${acc.bankName}</div>
          ${lastTransferDate ? `<div class="account-last-transfer">Last transfer on ${lastTransferDate}</div>` : ''}
        </div>
      </div>
    `;
  });

  accountsList.innerHTML = html;
}

function deleteSavedAccount(event, id) {
  event.stopPropagation();
  const account = savedAccounts.find(a => a.id === id);
  if (!account) return;
  const confirmed = confirm(`Remove saved account ${account.accountName} (${account.accountNumber})?`);
  if (!confirmed) return;
  savedAccounts = savedAccounts.filter(a => a.id !== id);
  saveState();
  renderSavedAccounts();
}

// Monnify API functions
async function loadBanks() {
  try {
    accountVerificationStatus.textContent = 'Loading banks...';
    accountVerificationStatus.style.color = 'var(--muted)';
    
    const response = await fetch(`${API_BASE_URL}/api/monnify/banks`);

    if (!response.ok) {
      throw new Error(`Request failed (${response.status})`);
    }

    const contentType = response.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      throw new Error('Unexpected response content type');
    }

    const data = await response.json();
    
    if (data.status && data.data) {
      banksList = data.data.map(bank => ({ ...bank, isFintech: false }));
      
      FINTECH_BANKS.forEach(fintech => {
        const exists = banksList.find(b => b.code === fintech.code || b.name.toLowerCase() === fintech.name.toLowerCase());
        if (!exists) {
          banksList.push(fintech);
        }
      });
      
      banksList.sort((a, b) => a.name.localeCompare(b.name));
      filteredBanksList = banksList;
      console.log(`✅ Loaded ${data.data.length} Monnify banks + ${FINTECH_BANKS.length} fintech banks = ${banksList.length} total`);
      
      accountVerificationStatus.textContent = `✅ ${banksList.length} banks loaded (including fintech) - Click search box to see all banks`;
      accountVerificationStatus.style.color = '#22c55e';
      setTimeout(() => {
        accountVerificationStatus.textContent = '';
      }, 4000);
    } else {
      throw new Error('Monnify returned invalid bank data');
    }
  } catch (error) {
    console.error('❌ Error loading banks:', error);
    banksList = FINTECH_BANKS.map(b => ({ ...b, isFintech: true }));
    filteredBanksList = banksList;
    accountVerificationStatus.textContent = `⚠️ Using fintech banks only (${banksList.length} banks). Monnify API unavailable.`;
    accountVerificationStatus.style.color = '#f59e0b';
    setTimeout(() => {
      accountVerificationStatus.textContent = '';
    }, 4000);
  }
}

function filterBanks(searchTerm) {
  if (!banksList || banksList.length === 0) {
    console.log('Banks list is empty');
    return;
  }

  if (!searchTerm || searchTerm.trim() === '') {
    filteredBanksList = banksList.slice(0, 50);
    renderBankDropdown();
    return;
  }

  const term = searchTerm.toLowerCase().trim();
  
  // Simple, direct filtering - only show banks that match the search term
  filteredBanksList = banksList.filter(bank => {
    const name = bank.name.toLowerCase();
    const code = bank.code.toLowerCase();
    
    // Match if bank name or code contains the search term
    return name.includes(term) || code.includes(term);
  });
  
  // Sort results: exact matches first, then banks whose name starts with the term, then others
  filteredBanksList.sort((a, b) => {
    const aName = a.name.toLowerCase();
    const bName = b.name.toLowerCase();
    
    // Exact name match comes first
    if (aName === term && bName !== term) return -1;
    if (bName === term && aName !== term) return 1;
    
    // Name starts with term comes next
    if (aName.startsWith(term) && !bName.startsWith(term)) return -1;
    if (bName.startsWith(term) && !aName.startsWith(term)) return 1;
    
    // Otherwise, alphabetical order
    return aName.localeCompare(bName);
  });
  
  console.log(`Filtered ${filteredBanksList.length} banks for search: "${term}"`);
  renderBankDropdown();
}

async function verifyAccount(accountNumber, bankCode) {
  if (!accountNumber || !bankCode) return;
  
  if (accountNumber.length !== 10) {
    accountVerificationStatus.textContent = '';
    accountName.value = '';
    accountName.disabled = false;
    accountName.placeholder = 'Account Name (auto-filled or enter manually)';
    isAccountVerified = false;
    submitTransfer.disabled = true;
    enterManuallyBtn.style.display = 'none';
    return;
  }

  try {
    accountVerificationStatus.textContent = 'Verifying account...';
    accountVerificationStatus.style.color = 'var(--muted)';
    accountName.disabled = false;
    accountName.placeholder = 'Account Name (auto-filled or enter manually)';
    enterManuallyBtn.style.display = 'none';
    
    const response = await fetch(`${API_BASE_URL}/api/monnify/verify`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        account_number: accountNumber,
        bank_code: bankCode
      })
    });

    const data = await response.json();
    const resolvedAccountName =
      data?.data?.account_name ||
      data?.data?.accountName ||
      data?.responseBody?.accountName ||
      data?.responseBody?.account_name ||
      '';
    
    if (!data.status) {
      accountName.value = '';
      accountName.disabled = false;
      accountName.placeholder = 'Account Name (enter manually)';
      accountVerificationStatus.textContent = data.message || 'Account verification failed - Enter name manually';
      accountVerificationStatus.style.color = '#f59e0b';
      enterManuallyBtn.style.display = 'block';

      const checkManualName = function() {
        if (accountName.value.trim().length >= 3) {
          isAccountVerified = true;
          submitTransfer.disabled = false;
          accountVerificationStatus.textContent = '✓ Ready to transfer (Manual Entry)';
          accountVerificationStatus.style.color = '#22c55e';
        } else if (accountName.value.trim().length > 0) {
          isAccountVerified = false;
          submitTransfer.disabled = true;
          accountVerificationStatus.textContent = 'Enter account name (minimum 3 characters)';
          accountVerificationStatus.style.color = '#f59e0b';
        }
      };

      accountName.removeEventListener('input', window.manualNameHandler);
      window.manualNameHandler = checkManualName;
      accountName.addEventListener('input', window.manualNameHandler);

      isAccountVerified = false;
      submitTransfer.disabled = true;
      return;
    }

    // If API returned a name, use it (even if it's marked as mock/test)
    if (data.status && resolvedAccountName) {
      accountName.value = resolvedAccountName;
      accountName.disabled = false;
      let statusText = '✓ Account verified';

      if (data?.data?.is_fintech) {
        statusText += ' (Fintech)';
      }

      accountVerificationStatus.textContent = statusText + ' - You can edit the name if needed';
      accountVerificationStatus.style.color = '#22c55e';
      isAccountVerified = true;
      submitTransfer.disabled = false;
      enterManuallyBtn.style.display = 'none';
      return;
    }

    // No name returned from API
    accountName.value = '';
    accountName.disabled = false;
    accountName.placeholder = 'Account Name (enter manually)';
    accountVerificationStatus.textContent = 'Account name could not be resolved - Enter name manually';
    accountVerificationStatus.style.color = '#f59e0b';
    enterManuallyBtn.style.display = 'block';

    const checkManualName = function() {
      if (accountName.value.trim().length >= 3) {
        isAccountVerified = true;
        submitTransfer.disabled = false;
        accountVerificationStatus.textContent = '✓ Ready to transfer (Manual Entry)';
        accountVerificationStatus.style.color = '#22c55e';
      } else if (accountName.value.trim().length > 0) {
        isAccountVerified = false;
        submitTransfer.disabled = true;
        accountVerificationStatus.textContent = 'Enter account name (minimum 3 characters)';
        accountVerificationStatus.style.color = '#f59e0b';
      }
    };

    accountName.removeEventListener('input', window.manualNameHandler);
    window.manualNameHandler = checkManualName;
    accountName.addEventListener('input', window.manualNameHandler);

    isAccountVerified = false;
    submitTransfer.disabled = true;
  } catch (error) {
    console.error('Error verifying account:', error);
    accountName.value = '';
    accountName.disabled = false;
    accountName.placeholder = 'Account Name (enter manually)';
    accountVerificationStatus.textContent = 'Error verifying account - Enter name manually';
    accountVerificationStatus.style.color = '#f59e0b';
    enterManuallyBtn.style.display = 'block';
    
    accountName.addEventListener('input', function checkManualName() {
      if (accountName.value.trim().length >= 3) {
        isAccountVerified = true;
        submitTransfer.disabled = false;
        accountVerificationStatus.textContent = '✓ Ready to transfer (Manual Entry)';
        accountVerificationStatus.style.color = '#22c55e';
      } else if (accountName.value.trim().length > 0) {
        isAccountVerified = false;
        submitTransfer.disabled = true;
        accountVerificationStatus.textContent = 'Enter account name (minimum 3 characters)';
        accountVerificationStatus.style.color = '#f59e0b';
      }
    }, { once: false });
    
    isAccountVerified = false;
    submitTransfer.disabled = true;
  }
}

submitTransfer.addEventListener('click', async () => {
  const bName = selectedBankName || bankSearch.value.trim();
  const bAcct = bankAcct.value.trim();
  const aName = accountName.value.trim();
  const amount = parseFloat(sendAmount.value || '0');

  if ((!selectedBankCode && !isManualBankEntry) || !bName || !bAcct || !aName || !amount || amount <= 0) {
    showStatus('Please fill all fields with valid details', false, formStatus);
    return;
  }
  
  if (isManualBankEntry && aName.length >= 3) {
    isAccountVerified = true;
  }
  if (amount > balance) {
    showStatus('Insufficient balance', false, formStatus);
    return;
  }
  if (!/^\d{10}$/.test(bAcct)) {
    showStatus('Bank account number must be 10 digits', false, formStatus);
    return;
  }

  // Require PIN before sending
  if (!requirePin('To Bank.html')) {
    return;
  }

  // If PIN is already verified this session, continue with transfer
  performTransfer({ bName, bAcct, aName, amount });
});

function performTransfer({ bName, bAcct, aName, amount }) {
  submitTransfer.classList.add('loading');

  (async () => {
    try {
      const response = await fetch(`${API_BASE_URL}/api/monnify/transfer`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          amount,
          bankCode: selectedBankCode || '',
          accountNumber: bAcct,
          accountName: aName,
          narration: `Transfer to ${aName}`
        })
      });

      const contentType = response.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        throw new Error(`Transfer API returned invalid response (${response.status})`);
      }

      const result = await response.json();
      if (!response.ok || !result.status) {
        throw new Error(result.message || 'Transfer failed');
      }

    balance = +(balance - amount).toFixed(2);
    const now = Date.now();
    const sessId = genSessId();
    const tx = { id: genId(), name: `Interbank to ${aName} (${bName} | ${bAcct})`, amount: -amount, time: now, sessId: sessId };
    transactions.unshift(tx);

    // Save the beneficiary account for future transfers
    saveAccount(bName, bAcct, aName);

    receiptDetails.innerHTML = `
      <div class="receipt-logo">PalmPay</div>

      <div class="receipt-amount">${formatNGN(amount)}</div>
      <div class="receipt-status">Successful Transaction</div>
      <div class="receipt-date">${getFormattedDate(now)}</div>

      <div class="divider"></div>

      <div class="row">
        <div class="label">Recipient:</div>
        <div class="value">
          <strong>${aName}</strong>
          <div class="sub">${bName} | ${bAcct}</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="row">
        <div class="label">Sender:</div>
        <div class="value">
          <strong>${getUserName().toUpperCase()}</strong>
          <div class="sub">${getUserPhone()} • PalmPay | ${senderAccountMask}</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section-title">Transaction Info:</div>

      <div class="row">
        <div class="label">Transaction Type</div>
        <div class="value">Interbank Transfer</div>
      </div>

      <div class="row" style="margin-top: 10px;">
        <div class="label">Transaction ID</div>
        <div class="value">${tx.id}</div>
      </div>

      <div class="row" style="margin-top: 10px;">
        <div class="label">Session ID</div>
        <div class="value">
          ${sessId.slice(0, 15)}<br/>
          ${sessId.slice(15)}
        </div>
      </div>

      <div class="divider"></div>

      <div class="receipt-footer-note">Enjoy Seamless and Unlimited Free Transfers to All Banks.</div>
    `;

    submitTransfer.classList.remove('loading');
    successScreen.classList.add('active');
    attachReceiptActions();
    } catch (error) {
      console.error('Transfer error:', error);
      showStatus(error.message || 'Transfer failed. Please try again.', false, formStatus);
      submitTransfer.classList.remove('loading');
    }
  })();
}


cancelTransfer.addEventListener('click', () => {
  window.location.href = 'index.html';
});

closeSuccess.addEventListener('click', () => {
  successScreen.classList.remove('active');
  receiptDetails.innerHTML = '';
  window.location.href = 'index.html';
});

function attachReceiptActions() {
  document.getElementById('shareReceipt').addEventListener('click', () => {
    alert('Share as Image: In a real app, this would share the receipt as an image.');
  });
  document.getElementById('saveReceipt').addEventListener('click', () => {
    alert('Save as PDF: In a real app, this would download the receipt as PDF.');
  });
}

let statusTimer = null;
function showStatus(msg, ok, statusElement = formStatus) {
  statusElement.textContent = msg;
  statusElement.style.color = ok ? '#22c55e' : '#ff4d4f';
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(() => {
    statusElement.textContent = '';
  }, 5000);
}

// Tab switching for saved accounts
accountsTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    accountsTabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.getAttribute('data-tab');
    
    // Re-render with current filter if any
    const acctNum = bankAcct.value.substring(0, 3);
    renderSavedAccounts(acctNum);
  });
});

// Initial render of saved accounts
renderSavedAccounts();

// Load banks on page load
loadBanks();
</script>

<!-- PWA Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const head = await fetch('/service-worker.js', { method: 'HEAD' });
      if (!head.ok) {
        console.warn('Service worker not found, skipping registration.');
        return;
      }
      const registration = await navigator.serviceWorker.register('./service-worker.js');
      console.log('✓ Service Worker registered:', registration.scope);
    } catch (error) {
      console.warn('Service Worker registration skipped:', error);
    }
  });
}

// Prompt for PWA installation
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log('PWA is installable');
});

window.addEventListener('appinstalled', () => {
  console.log('✓ PWA installed successfully');
  deferredPrompt = null;
});
</script>
